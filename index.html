<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Against All Odds — a neon arcade survival game. No weapons: fly through gates to destroy the horde." />
    <title>Against All Odds</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Orbitron:wght@900&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        overscroll-behavior: none;
      }
      #game {
        position: fixed;
        inset: 0;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game canvas {
        display: block;
      }
      #menu-extras {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: max(12px, env(safe-area-inset-bottom));
        display: none;
        align-items: center;
        justify-content: flex-end;
        gap: 12px;
        pointer-events: none;
      }
      body.in-menu #menu-extras {
        display: flex;
      }
      #menu-extras > * {
        pointer-events: auto;
      }
      #menu-extras a {
        font-family: Orbitron, sans-serif;
        font-size: 13px;
        letter-spacing: 0.08em;
        color: #7fe9ff;
        text-decoration: none;
        border: 1px solid #7fe9ff88;
        padding: 10px 14px;
        white-space: nowrap;
        flex-shrink: 0;
        background: #0008;
      }
      #menu-extras a:hover {
        background: #55eeff22;
      }

      /* Leaderboard panels (src/panels.ts) */
      .pq-overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 16px;
        background: #000a;
        z-index: 10;
      }
      .pq-panel {
        box-sizing: border-box;
        width: min(440px, 100%);
        max-height: 100%;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 24px;
        background: #05060cee;
        border: 2px solid #55eeffcc;
        box-shadow: 0 0 24px #55eeff44;
        color: #fff;
        font-family: DotGothic16, monospace;
        text-align: center;
      }
      .pq-title {
        margin: 0;
        font-family: Orbitron, sans-serif;
        font-weight: 900;
        font-size: 24px;
        letter-spacing: 0.06em;
        color: #bff8ff;
        text-shadow: 0 0 12px #55eeff;
      }
      .pq-score {
        margin: 0;
        font-size: 40px;
        text-shadow: 0 0 12px #55eeff;
      }
      .pq-input {
        box-sizing: border-box;
        width: 100%;
        padding: 12px;
        font: 22px DotGothic16, monospace;
        color: #fff;
        background: #000;
        border: 2px solid #55eeff88;
        outline: none;
        text-align: center;
      }
      .pq-input:focus {
        border-color: #55eeff;
        box-shadow: 0 0 12px #55eeff66;
      }
      .pq-hint,
      .pq-message {
        margin: 0;
        font-size: 14px;
        color: #8a93b8;
        min-height: 1em;
      }
      .pq-message {
        color: #ff7ad9;
      }
      .pq-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        width: 100%;
      }
      .pq-button {
        flex: 1;
        min-height: 48px;
        padding: 0 16px;
        font: 900 16px Orbitron, sans-serif;
        letter-spacing: 0.06em;
        color: #bff8ff;
        background: #0008;
        border: 2px solid #55eeffcc;
        cursor: pointer;
      }
      .pq-button:hover,
      .pq-button:focus-visible {
        background: #55eeff33;
        outline: none;
      }
      .pq-button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      .pq-small {
        flex: 0 0 48px;
        padding: 0;
      }
      .pq-difficulty {
        flex: 1;
        font: 900 18px Orbitron, sans-serif;
      }
      .pq-list {
        width: 100%;
        margin: 0;
        padding: 0 0 0 2.4em;
        font-size: 18px;
        text-align: left;
      }
      .pq-list li {
        padding: 4px 0;
        border-bottom: 1px solid #55eeff22;
      }
      .pq-list li::marker {
        color: #8a93b8;
      }
      .pq-name {
        display: inline-block;
        width: 60%;
      }
      .pq-points {
        display: inline-block;
        width: 40%;
        text-align: right;
        color: #9dff4a;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="menu-extras">
      <a href="https://youtu.be/HVIbuHl9hpM" target="_blank" rel="noopener">HOW TO PLAY</a>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
